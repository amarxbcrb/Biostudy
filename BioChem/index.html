<!DOCTYPE html>
<html lang="fr" data-verre="calc" data-haptic="own" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#f2f2f7" id="metaTheme">
<title>BioChem - by AMAR</title>
<meta name="description" content="BioChem : molarité, concentration massique, molalité, masse volumique et solutions commerciales.">
<link rel="icon" type="image/png" href="/Pictures/favicon.png">
<link rel="apple-touch-icon" href="/Pictures/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BioStudy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* thème avant le premier rendu : choix mémorisé pour la période (jour / nuit) en cours, sinon celui du système */
(()=>{const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},h=new Date().getHours(),th=g('bioChemTheme');
document.documentElement.dataset.theme=th&&g('bioChemThemePeriod')===(h>=7&&h<20?'day':'night')?th:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'})();
</script>
<style>
/* ===== 1. Jetons : palette Réglages iOS (clair #f2f2f7 / groupes blancs ; sombre noir / groupes #1c1c1e) ===== */
#bc{--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);
--top:70px;--gx:14px;--navh:60px;--blur:22px;
--grp:#fff;--fill:rgba(118,118,128,.12);--thumb:#fff;--tx:#000;--tx2:#6c6c70;--tx3:#8a8a8e;--sep:rgba(60,60,67,.18);
--acc:var(--c-blue);--acc-tx:color-mix(in srgb,var(--acc) 78%,#000);--brand:#0064d2;
--c-blue:#007aff;--c-indigo:#5856d6;--c-purple:#af52de;--c-pink:#ff2d55;--c-orange:#ff9500;--c-green:#34c759;--c-teal:#30b0c7;--c-cyan:#32ade6;--c-mint:#00c7be;--c-brown:#a2845e;
--ok:#1f8a3b;--err:#d70015;--warn:#ff9500;
--lg-rgb:255,255,255;--lg-a:.68;--lg-hi:#fff;--lg-sh:rgba(0,0,0,.12);--hair:rgba(0,0,0,.09);
--fb:rgba(60,60,67,.3);--lens:rgba(120,120,128,.16);--lens-line:rgba(255,255,255,.9);--veil:rgba(0,0,0,.22);--blob:.3;
color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.4}
[data-theme=dark] #bc{--grp:#1c1c1e;--fill:#2c2c2e;--thumb:#636366;--tx:#fff;--tx2:#a1a1a6;--tx3:#8e8e93;--sep:rgba(84,84,88,.6);
--acc-tx:color-mix(in srgb,var(--acc) 72%,#fff);--brand:#4da3ff;
--c-blue:#0a84ff;--c-indigo:#5e5ce6;--c-purple:#bf5af2;--c-pink:#ff375f;--c-orange:#ff9f0a;--c-green:#30d158;--c-teal:#40cbe0;--c-cyan:#64d2ff;--c-mint:#63e6e2;--c-brown:#ac8e68;
--ok:#30d158;--err:#ff453a;
--lg-rgb:28,28,30;--lg-a:.66;--lg-hi:rgba(255,255,255,.34);--lg-sh:rgba(0,0,0,.5);--hair:rgba(255,255,255,.08);
--fb:rgba(235,235,245,.26);--lens:rgba(255,255,255,.17);--lens-line:rgba(255,255,255,.26);--veil:rgba(0,0,0,.5);--blob:0}
/* accent par onglet : molarité bleu, massique sarcelle, molalité indigo, masse volumique orange, solution commerciale rose */
#bc[data-tab="1"]{--acc:var(--c-teal)}#bc[data-tab="2"]{--acc:var(--c-indigo)}#bc[data-tab="3"]{--acc:var(--c-orange)}#bc[data-tab="4"]{--acc:var(--c-pink)}
#bc .nb:nth-of-type(1){--nc:var(--c-blue)}#bc .nb:nth-of-type(2){--nc:var(--c-teal)}#bc .nb:nth-of-type(3){--nc:var(--c-indigo)}#bc .nb:nth-of-type(4){--nc:var(--c-orange)}#bc .nb:nth-of-type(5){--nc:var(--c-pink)}
@media(min-width:600px){#bc{--gx:24px;--top:80px}}
@media(min-width:900px){#bc{--gx:36px;--top:92px}}
html{background:#f2f2f7;color-scheme:light;-webkit-text-size-adjust:100%;overflow-x:clip;overscroll-behavior:none;transition:background .4s}
html[data-theme=dark]{background:#000;color-scheme:dark}
body{margin:0;min-height:100dvh;overflow-x:clip;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#bc::before{content:"";position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:var(--blob);filter:blur(60px);animation:flow 20s ease-in-out infinite alternate;
background:radial-gradient(circle at 20% 30%,rgba(10,132,255,.5),transparent 40%),radial-gradient(circle at 80% 70%,rgba(94,92,230,.25),transparent 40%),radial-gradient(circle at 50% 10%,rgba(142,142,147,.15),transparent 40%)}
@keyframes flow{to{transform:translate(-4%,3%) rotate(8deg)}}
:where(#bc) *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:where(#bc) :is(button,input,select){font:inherit;color:inherit}
:where(#bc) button{border:0;background:none;cursor:pointer;touch-action:manipulation}
#bc :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bc :is(input,select):focus-visible{outline:none}
#bc [hidden]{display:none!important}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ===== 2. Verre (barres, menus, historique) : un seul style, reflet qui suit la souris ===== */
.glass{position:relative;background:rgba(var(--lg-rgb),var(--lg-a));-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);
box-shadow:inset 0 1px 0 var(--lg-hi),0 0 0 .5px var(--hair),0 12px 30px var(--lg-sh)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
background:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 70%)}
.glass.lit::after{opacity:1}
@media(prefers-reduced-transparency:reduce){.glass{background:var(--grp);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ===== 3. En-tête ===== */
header{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top);pointer-events:none}
.hin{max-width:1080px;margin:auto;padding:12px var(--gx);display:flex;justify-content:space-between;align-items:center;gap:8px;animation:drop .7s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}}
.logo-c{flex:1;min-width:0;pointer-events:auto}
.logo{font-size:clamp(1.45rem,6.4vw,1.9rem);font-weight:800;letter-spacing:-.6px;line-height:1;white-space:nowrap}
.logo i{font-style:normal;color:var(--brand)}
.sub{font-size:.75rem;font-weight:600;color:var(--tx2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hact{pointer-events:auto;display:flex;align-items:center;gap:8px;position:relative}
.tools{height:48px;padding:0 4px;border-radius:999px;display:flex;align-items:center;gap:2px}
.tb,.mb{display:grid;place-items:center;border-radius:50%;font-size:20px;transition:transform .35s var(--spring),background .3s}
.tb{width:40px;height:40px;position:relative;z-index:1}
.mb{width:48px;height:48px}
.tb:active{transform:scale(.86);background:var(--fill)}
.mb:active{transform:scale(.88)}
@media(hover:hover){.tb:hover{background:var(--fill)}.mb:hover{transform:scale(1.06)}}
.badge{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--warn);transform:scale(0);transition:transform .35s var(--spring)}
.badge.on{transform:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,10,.8)}70%,to{box-shadow:0 0 0 8px transparent}}
.pop{position:absolute;top:calc(100% + 10px);right:56px;padding:6px;border-radius:26px;display:none;flex-direction:column;transform-origin:top right}
.pop.on{display:flex;animation:pop .45s var(--spring)}
.lmenu{min-width:176px}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(-8px)}}
.lmenu button{position:relative;z-index:1;min-height:44px;padding:11px 16px;border-radius:999px;text-align:left;font-size:15px;font-weight:600}
.lmenu button:hover,.lmenu button.on{background:var(--fill);color:var(--acc-tx)}

/* ===== 4. Page : saisie puis résultat ===== */
.shell{min-height:100dvh;max-width:1080px;margin:auto;display:flex;flex-direction:column;
padding:calc(var(--top) + env(safe-area-inset-top)) var(--gx) calc(var(--navh) + 96px + env(safe-area-inset-bottom))}
.stage{flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-content:center;animation:rise .7s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media(min-width:900px){.stage{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px}}
.inputs{display:flex;flex-direction:column;min-width:0}
.thead{display:flex;align-items:center;gap:10px;margin:0 4px 14px}
.roll{height:38px;overflow:hidden}
.roll>div{transition:transform .8s var(--spring)}
.roll span{height:38px;display:grid;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnb{width:30px;flex-shrink:0;font-size:27px;color:var(--acc-tx)}
.rnb span{place-items:center}
.rttl{flex:1;min-width:0;font-size:clamp(22px,5vw,27px);font-weight:800;letter-spacing:-.6px}
.view{display:none}
.view.on{display:block}
/* en-têtes de groupe façon Réglages */
.gh{margin:20px 16px 7px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2)}
/* segments : la pastille se place en CSS (--i : index, --n : nombre) */
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--fill);--i:0;--n:2}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.18);
transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--spring)}
.seg button{flex:1;min-width:0;height:34px;position:relative;z-index:1;border-radius:999px;font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:color .3s,transform .35s var(--spring)}
.seg button:active{transform:scale(.94)}
.seg button.on{color:var(--tx)}
/* « Calculer » : symbole + nom court ; la grandeur choisie disparaît des valeurs connues */
.cal button{height:52px;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal b,.sym,.fl{font-family:var(--serif);font-style:italic;color:var(--acc-tx)}
.cal b{font-size:20px;line-height:1}
.cal small{max-width:100%;font-size:11px;overflow:hidden;text-overflow:ellipsis}
:is(.cal b,.sym,.fl) sub{font-size:.6em}
/* valeurs connues : un groupe, une ligne par grandeur ; seule l'unité est en capsule */
.grp{background:var(--grp);border-radius:22px;overflow:hidden}
.vr{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:58px;padding:8px 12px 8px 16px;transition:background .25s}
.vr:not([hidden])~.vr::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.vr:focus-within{background:color-mix(in srgb,var(--grp) 94%,var(--acc))}
.lb{flex:1 1 96px;min-width:0;display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:600;line-height:1.25}
.lb .ls{display:none}
@media(max-width:599px){.lb .ln{display:none}.lb .ls{display:inline}}
/* scientifique sur mobile : tout tient sur la ligne (champs plus compacts) */
@media(max-width:599px){.vr:has(>.ctl.sci) .lb{flex-basis:56px}.ctl.sci{gap:5px}.ctl.sci .val{flex-basis:78px;width:78px;padding:0 10px;font-size:17px}
.ctl.sci .exp{flex-basis:42px;width:42px}.ctl.sci .sel{flex-basis:92px;width:92px;padding:0 22px 0 11px;font-size:14px;background-position:right 8px center}}
.sym{flex-shrink:0;min-width:28px;height:28px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;align-self:center;background:var(--sc);color:#fff;font-size:16px;font-weight:700;line-height:1;white-space:nowrap}
.lb{align-items:center}
.ctl{flex:1 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px}
/* champs modifiables : capsule bordée teintée (les unités restent des capsules grises à chevron) */
.val,.exp{border:1.5px solid var(--fb);background:transparent;border-radius:999px;font-weight:600;cursor:text;
transition:border-color .2s,box-shadow .2s,background .2s}
.val{flex:0 0 112px;width:112px;min-width:0;height:42px;padding:0 14px;font-size:19px;text-align:right}
.ctl.sci .val{flex-basis:92px;width:92px}
.exp{flex:0 0 52px;width:52px;height:38px;font-size:16px;text-align:center}
.val:focus,.exp:focus{border-color:var(--acc);background:var(--grp);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.val::placeholder,.exp::placeholder{color:var(--tx3);font-weight:500}
.x10{font-size:13px;font-weight:700;color:var(--tx2)}
.ctl:not(.sci) :is(.x10,.exp){display:none}
.sel{flex:0 0 108px;width:108px;height:38px;padding:0 28px 0 14px;border:0;border-radius:999px;appearance:none;-webkit-appearance:none;cursor:pointer;
background:var(--fill) url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8f9b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e") no-repeat right 10px center/12px;
font-size:15px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .3s var(--spring)}
.sel:active{transform:scale(.97)}
.sel:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.sel option{background:var(--grp);color:var(--tx)}
.fl{margin:12px 0 0;padding:12px 20px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);font-size:22px;font-weight:600;font-style:normal}
.fl small{font:700 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.5px;text-transform:uppercase;color:var(--acc-tx);opacity:.8}
.fl span{font-style:italic;white-space:nowrap}
.fl.hit{animation:lawpop .45s var(--spring)}
@keyframes lawpop{40%{transform:scale(1.04)}}
/* résultat : valeur + unité (capsule), équation, actions */
.results{display:flex;flex-direction:column;min-width:0}
.results>.gh{margin-top:0}
.rg{background:var(--grp);border-radius:22px;overflow:hidden;text-align:center}
.rv{min-height:92px;padding:22px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.num{font-size:clamp(32px,10vw,44px);font-weight:800;letter-spacing:-1px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
#ru .sel{flex:none;width:auto;height:42px;padding:0 34px 0 16px;background-position:right 12px center;font-size:20px;font-weight:700;color:var(--acc-tx)}
.eq{padding:0 16px 16px;font-size:14px;font-weight:500;color:var(--tx2);line-height:1.45;overflow-wrap:anywhere}
.acts{display:flex;border-top:.5px solid var(--sep)}
.ab{flex:1;height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--acc-tx);transition:opacity .2s,color .2s}
.ab+.ab{border-left:.5px solid var(--sep)}
.ab .ic{font-size:17px}
.ab:active{opacity:.5}
.ab:disabled{opacity:.35;pointer-events:none}
.ab.ok{color:var(--ok)}
.bump{animation:bump .55s var(--spring)}
@keyframes bump{40%{transform:scale(1.07)}}
.tip{margin:10px 16px 0;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.45}
.tip:empty{display:none}
.tip .ic{margin-top:2px;font-size:15px}
.tip.err{color:var(--err);font-weight:600}

/* ===== 5. Barre d'onglets (façon BioCampus) et résultat flottant ===== */
.nav{position:fixed;z-index:30;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:440px;height:var(--navh);margin-inline:auto;border-radius:999px;
animation:navin .8s var(--ease) backwards .2s}
@keyframes navin{from{opacity:0;translate:0 40px;scale:.94}}
@keyframes navin-d{from{opacity:0;translate:0 -30px;scale:.94}}
.nav-in{height:100%;padding:5px;border-radius:999px;display:flex;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.nav-in.dragging{cursor:grabbing}
.sl{position:absolute;top:5px;bottom:5px;left:0;width:80px;z-index:1;border-radius:999px;pointer-events:none;translate:5px 0;
background:var(--lens);border:1px solid var(--lens-line);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.14);
transition:translate .6s var(--spring),width .3s var(--ease),scale .3s var(--spring)}
.sl.interacting{scale:1.06 1.12}
.dragging .sl{transition:scale .25s var(--spring)}
.nb{flex:1;position:relative;z-index:2;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
font-size:.66rem;font-weight:500;color:var(--tx2);white-space:nowrap;transition:color .3s,transform .45s var(--spring)}
.nb:active{transform:scale(.92)}
.nb .ic{font-size:20px}
.nb.on{color:var(--acc-tx);font-weight:600}
.nb .ic{color:var(--nc);opacity:.75;transition:opacity .3s}.nb.on .ic{opacity:1}
.nb.on .ic{animation:ipop .35s var(--ease)}
@keyframes ipop{from{transform:scale(.85)}}
.mini{position:fixed;z-index:29;left:12px;right:12px;max-width:440px;margin-inline:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + var(--navh) + 10px);
min-height:46px;padding:8px 18px;border-radius:999px;display:flex;align-items:baseline;justify-content:center;gap:8px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
opacity:0;translate:0 16px;pointer-events:none;transition:opacity .3s,translate .45s var(--spring)}
.mini.on{opacity:1;translate:0;pointer-events:auto}
#bc.kb .mini{bottom:auto}
#bc.kb .nav{visibility:hidden}
.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ml{font:italic 700 17px var(--serif);color:var(--acc-tx)}
.mini .mu{font-size:16px;color:var(--acc-tx)}

/* ===== 6. Historique (verre), choix d'unité composée (molettes façon horloge) ===== */
.ov{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;visibility:hidden;transition:background .4s,visibility 0s .6s}
.ov.on{background:var(--veil);visibility:visible;transition:background .4s}
.sheet{--lg-a:.7;--blur:30px;width:88%;max-width:420px;height:100%;border-radius:32px 0 0 32px;display:flex;flex-direction:column;
padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));transform:translateX(104%);transition:transform .6s var(--ease)}
.ov.on .sheet{transform:none}
.oh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px;border-bottom:.5px solid var(--sep)}
.ot{font-size:20px;font-weight:800}
.x,.hdel{width:40px;height:40px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:transform .45s var(--spring),color .2s}
.x{background:var(--fill)}
.x:active{transform:scale(.85) rotate(90deg)}
.hl{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:14px}
.hi{display:flex;align-items:center;gap:8px;padding:12px 0 12px 4px;border-bottom:.5px solid var(--sep);animation:slide .5s var(--ease) backwards}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}}
.hi>div{flex:1;min-width:0}
.ht{font-size:12px;font-weight:700;color:var(--acc-tx)}
.hd{margin-top:3px;font-size:14px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.hd b{color:var(--acc-tx)}
.hdel{color:var(--tx2)}
.hdel:hover{color:var(--err)}
.hempty{padding:30px 0;text-align:center;font-size:14px;color:var(--tx2)}
.clr{min-height:48px;margin-top:8px;border-radius:999px;border:1.5px solid var(--err)!important;color:var(--err);font-size:14px;font-weight:700;transition:transform .35s var(--spring)}
.clr:active{transform:scale(.95)}
.upop{--lg-a:.86;position:fixed;z-index:60;width:min(300px,calc(100vw - 16px));padding:12px;border-radius:22px;max-height:calc(100dvh - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.up-n{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px;margin-bottom:8px;border-bottom:.5px solid var(--sep)}
.up-n button{min-height:34px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600}
.up-n button.on{background:var(--acc);color:#fff}

/* ---------- 6. Nombres : lecture souple, affichage à 4 chiffres significatifs ---------- */
const sup=s=>String(s).replace(/./g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]||({'-':'⁻','+':'⁺'}[c]||c));
const clean=n=>Number.isFinite(n)&&n!==0?Number(n.toPrecision(12)):n;
const dec=s=>S.lang==='fr'?s.replace('.',','):s;
const grp=s=>{const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');return p.join('.')};
function sciStr(c){const[m,e]=c.toExponential(11).split('e'),k=+e,mt=dec(String(Number(m)));return k?`${mt} × 10${sup(k)}`:mt}
function fmt(n){if(!Number.isFinite(n))return'-';if(n===0)return'0';const c=Number(n.toPrecision(4)),a=Math.abs(c);
  return S.rsci||a<1e-4||a>=1e6?sciStr(c):dec(grp(String(c)))}
/* valeur saisie telle quelle dans l'équation (pleine précision) */
const echo=v=>{if(v===0)return'0';const c=clean(v),a=Math.abs(c);return !S.rsci&&a>=1e-6&&a<1e21?dec(String(c)):sciStr(c)};
/* saisie : virgule ou point, 2e-3, 2×10^-3, 2x10-3 */
function num(raw){const c=String(raw||'').replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/[×x*]10\^?/i,'e');
  if(!c)return{empty:1};
  if(!/^[+-]?(\d+(\.\d*)?|\.\d+)(e[+-]?\d+)?$/i.test(c))return{bad:1};
  const v=Number(c);return Number.isFinite(v)?{v}:{bad:1}}
/* lecture d'une ligne : décimale, ou mantisse × 10^exposant en mode scientifique */
const FXK='bch_fx',FXD='std';let FX={};try{FX=JSON.parse(sto.g(FXK))||{}}catch(e){}
const isSci=(id,k)=>(FX[id+'-'+k]||FXD)==='sci';
function applyFx(){$$('.ctl').forEach(c=>{const v=c.querySelector('.val');if(v&&v.id)c.classList.toggle('sci',(FX[v.id]||FXD)==='sci')});$$('.ucap').forEach(ulab)}
function readVal(id,k){const r=num($(`${id}-${k}`).value);if(!('v' in r)||!isSci(id,k))return r;
  const e=$(`${id}-${k}-e`).value.trim().replace(/[−–]/g,'-');if(!e)return r;
  return /^[+-]?\d+$/.test(e)?{v:r.v*10**+e}:{bad:1}}
/* écriture d'une valeur au format courant (sig chiffres significatifs) */
function writeVal(id,k,v,sig){const A=$(`${id}-${k}`),E=$(`${id}-${k}-e`);
  if(v==null||v===0){A.value=v===0?'0':'';E.value='';return}
  if(isSci(id,k)){const[m,e]=v.toExponential(sig-1).split('e');A.value=dec(String(Number(m)));E.value=String(+e)}
  else{A.value=dec(String(Number(v.toPrecision(sig))));E.value=''}}

/* ---------- 7. Construction : barre d'onglets, titres, vues ---------- */
const unitCtl=(id,dim,u)=>{const k=Object.keys(D[dim].u);return`<button type="button" id="${id}" class="sel ucap${D[dim].r||k.length>1?'':k[0]?' u1':' u0'}" data-dim="${dim}" value="${u}" data-al="a_unit">${u}</button>`};
const field=(id,cls,al,mode,ph='')=>`<input id="${id}" class="${cls}" type="text" inputmode="${mode}" autocomplete="off" spellcheck="false" data-al="${al}" data-ph="${ph}">`;
$('views').innerHTML=TABS.map((tb,i)=>`<section class="view" id="view${i}">
<p class="gh" data-key="calc"></p>
<div class="seg cal" id="${tb.id}-cal" role="group" style="--n:${tb.vars.length}"><i class="th"></i>${tb.vars.map(v=>`<button type="button" data-k="${v.k}"><b style="color:var(--c-${DC[v.dim]})">${v.sh}</b><small data-key="s_${v.n}"></small></button>`).join('')}</div>
<p class="fl"><small data-key="law"></small><span id="${tb.id}-fml"></span></p>
<p class="gh" data-key="known"></p>
<div class="grp">${tb.vars.map(v=>`<div class="vr" id="${tb.id}-r-${v.k}"><div class="lb"><span class="sym" style="--sc:var(--c-${DC[v.dim]})">${v.sh}</span><span class="ln" data-key="v_${v.n}"></span><span class="ls" data-key="s_${v.n}"></span></div>
<div class="ctl">${field(`${tb.id}-${v.k}`,'val','v_'+v.n,'decimal',v.ph)}<span class="x10">×10</span>${field(`${tb.id}-${v.k}-e`,'exp','a_exp','text','0')}${unitCtl(`${tb.id}-${v.k}-u`,v.dim,v.u)}</div></div>`).join('')}</div>
</section>`).join('');

$('rn').innerHTML=TABS.map(tb=>`<span>${IC[tb.ic]}</span>`).join('');
$$('[data-ic]').forEach(e=>{e.insertAdjacentHTML('afterbegin',IC[e.dataset.ic]);e.removeAttribute('data-ic')});

/* ---------- 8. Grandeur à calculer : choisie dans « Calculer », masquée des valeurs connues ----------
   son unité passe dans le résultat ; l'ancienne inconnue redevient une ligne saisissable, avec sa valeur calculée */
const segSet=(seg,i)=>{seg.style.setProperty('--i',i);seg.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-pressed',j===i)})};
const home=u=>$(u.id.replace(/^(\w+)-(\w+)-u$/,'$1-r-$2')).lastElementChild;
function dockUnit(){const tb=cur(),u=$(`${tb.id}-${S.tgt[tb.id]}-u`),ru=$('ru'),o=ru.firstElementChild;
  if(o===u)return;if(o)home(o).appendChild(o);ru.appendChild(u)}
function setTarget(tb,k,user){
  S.tgt[tb.id]=k;segSet($(tb.id+'-cal'),tb.vars.findIndex(v=>v.k===k));
  tb.vars.forEach(v=>{const r=$(`${tb.id}-r-${v.k}`),hide=v.k===k;
    if(user&&r.hidden&&!hide&&!RM)r.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],{duration:350,easing:'cubic-bezier(.22,1,.36,1)'});
    r.hidden=hide});
  const fl=$(tb.id+'-fml');fl.innerHTML=tb.f[k];
  if(user&&!RM){fl.parentNode.classList.remove('hit');void fl.offsetWidth;fl.parentNode.classList.add('hit')}
  if(user){buzz();dockUnit();recalc();save()}}

/* ---------- 9. Calcul et affichage ---------- */
let shown=null,raf=0;
function fit(){const n=$('num'),a=$('rv').clientWidth-32;n.style.fontSize='';const w=n.scrollWidth;
  if(w>a)n.style.fontSize=Math.max(16,parseFloat(getComputedStyle(n).fontSize)*a/w*.98)+'px'}
/* la valeur glisse vers la nouvelle (interpolation logarithmique) */
function setNum(v){cancelAnimationFrame(raf);const n=$('num');
  if(v==null||RM||!(shown>0&&v>0)||shown===v||Math.abs(Math.log10(v/shown))>40){shown=v;n.textContent=v==null?'-':fmt(v);return fit()}
  const a=Math.log(shown),b=Math.log(v),t0=performance.now();
  (function f(now){const p=Math.min(1,(now-t0)/380);shown=p<1?Math.exp(a+(b-a)*(1-(1-p)**3)):v;n.textContent=fmt(shown);fit();if(p<1)raf=requestAnimationFrame(f)})(t0)}
const setBtn=(b,icon,key,ok)=>{b.classList.toggle('ok',!!ok);b.innerHTML=`${IC[icon]}<span>${t(key)}</span>`};
const resetBtns=()=>{setBtn($('bCopy'),'copy','btn_copy');setBtn($('bSave'),'save','btn_save')};
function show(v,o){const ok=v!=null,was=S.ok;S.ok=ok;if(ok&&!was&&!RM&&!S.inTab&&window.bsResAnim)bsResAnim(0,0);S.last=ok?o.rec:null;
  setNum(v);$('eq').textContent=o.eq;
  const tp=$('tip');tp.classList.toggle('err',!!o.err);tp.innerHTML=o.tip?`${IC[o.err?'warn':'info']}<span>${esc(o.tip)}</span>`:'';
  $('bCopy').disabled=$('bSave').disabled=!ok;resetBtns();
  $('miniN').textContent=ok?fmt(v):'';$('miniU').textContent=ok?o.u:'';miniUpd()}
function recalc(){S.rsci=isSci(cur().id,S.tgt[cur().id]);
  const tb=cur(),id=tb.id,k=S.tgt[id],kv=tb.vars.find(v=>v.k===k),un=$(`${id}-${k}-u`).value,x={},parts=[];
  $('rt').textContent=t('v_'+kv.n);$('ml').innerHTML=kv.sh+' =';
  let err='',empty=false,res,val;
  for(const v of tb.vars){if(v.k===k)continue;
    const r=readVal(id,v.k);
    if(r.empty){empty=true;continue}
    if(r.bad){err='bad';break}
    if(r.v<0){err='neg';break}
    const u=$(`${id}-${v.k}-u`).value;x[v.k]=r.v*fu(v.dim,u);
    if(!Number.isFinite(x[v.k])){err='ovf';break}
    parts.push(`${v.s} = ${echo(r.v)} ${u}`)}
  if(!err&&x.w>100)err='pct';
  if(!err&&empty){writeVal(id,k,null);return show(null,{eq:t('wait'),tip:t('tip_wait')})}
  if(!err){res=tb.solve[k](x);val=res/fu(kv.dim,un);
    err=!Number.isFinite(res)?(Object.values(x).includes(0)?'zero':'ovf'):res<0?'neg':k==='w'&&res>100?'pct':!Number.isFinite(val)?'ovf':''}
  if(err){writeVal(id,k,null);return show(null,{eq:t(err),tip:t('tip_'+err),err:1})}
  x[k]=res;writeVal(id,k,val,4);
  const from=parts.join(' • '),to=`${kv.s} = ${fmt(val)} ${un}`,eq=`${from} → ${to}`;
  show(val,{eq,u:un,tip:tb.note?tb.note(x):'',rec:{from,to,eq}})}
/* résultat flottant (mobile) : visible quand la carte résultat est hors écran */
let resSeen=true;
const miniUpd=()=>$('mini').classList.toggle('on',S.ok&&!resSeen);
if('IntersectionObserver' in window)new IntersectionObserver(es=>{resSeen=es[0].isIntersecting;miniUpd()},{threshold:.3}).observe($('rv'));
/* clavier ouvert (mobile) : le résultat flottant se place juste au-dessus du clavier, la barre d'onglets s'efface */
if(window.visualViewport){const vv=visualViewport,m=$('mini');
  const kb=()=>{const a=document.activeElement,open=innerHeight-vv.height>120&&!!a&&a.matches('input');
    BC.classList.toggle('kb',open);m.style.top=open?Math.round(vv.offsetTop+vv.height-m.offsetHeight-8)+'px':''};
  vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);
  addEventListener('focusin',()=>setTimeout(kb,350));addEventListener('focusout',()=>setTimeout(kb,120))}
$('mini').addEventListener('click',()=>$('resBox').scrollIntoView({behavior:RM?'auto':'smooth',block:'center'}));

/* ---------- 10. Onglets : sortie 200 ms, entrée en cascade, zoom ressort du résultat ---------- */
let anims=[],tabTok=0;
function play(el,kf,o,done){const a=el.animate(kf,o);anims.push(a);a.onfinish=()=>{anims=anims.filter(x=>x!==a);a.cancel();done&&done()}}
function setTab(i,dir){
  const old=S.tab;if(i===old)return;
  const next=$('view'+i),prev=old>=0?$('view'+old):null,my=++tabTok;
  dir=dir||(i>old?1:-1);S.tab=i;BC.dataset.tab=i;sto.s('bch_tab',i);
  navCtl.select(i);nbs.forEach((b,k)=>b.classList.toggle('on',k===i));
  $('rn').style.transform=$('rtt').style.transform=`translateY(${-i*100/TABS.length}%)`;
  if(prev){buzz();scrollTo(0,0)}
  anims.splice(0).forEach(a=>{a.onfinish=null;a.cancel()});
  $$('.view').forEach(v=>v!==prev&&v!==next&&v.classList.remove('on'));
  const enter=()=>{if(my!==tabTok)return;
    if(prev)prev.classList.remove('on');next.classList.add('on');dockUnit();shown=null;S.inTab=1;recalc();S.inTab=0;
    if(RM||!prev)return;
    $$('.gh,.cal,.grp,.fl',next).forEach((e,k)=>play(e,[{opacity:0,transform:`translateX(${dir*38}px) scale(.97)`},{opacity:1,transform:'none'}],{duration:600,delay:k*50,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'}));
    (window.bsResAnim&&bsResAnim(dir,90))};
  if(RM||!prev||!prev.classList.contains('on'))enter();
  else{const rg=document.querySelector('.rg');if(rg)play(rg,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(26px) scale(.92)'}],{duration:200,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
    play(prev,[{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*44}px) scale(.96)`}],{duration:200,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'},enter)}}
/* barre : lentille qui suit le doigt (liquid-glass.js) ; sans le moteur, simple pastille */
const sl=$('sl'),navCtl=window.LiquidGlass?LiquidGlass.tabs({wrap:$('navWrap'),inner:$('nav'),indicator:sl,items:nbs,onSelect:i=>setTab(i),glass:false})
  :{select(i){sl.style.translate=nbs[i].offsetLeft+'px 0';sl.style.width=nbs[i].offsetWidth+'px'}};
if(!window.LiquidGlass){nbs.forEach((b,i)=>b.addEventListener('click',()=>setTab(i)));addEventListener('resize',()=>navCtl.select(S.tab))}
/* balayage horizontal sur la carte */
(()=>{let x0,y0,t0,ok=false;const c=$('card');
  c.addEventListener('touchstart',e=>{ok=!e.target.closest('input,select,button');const p=e.touches[0];x0=p.clientX;y0=p.clientY;t0=Date.now()},{passive:true});
  c.addEventListener('touchend',e=>{if(!ok)return;const p=e.changedTouches[0],dx=p.clientX-x0,dy=p.clientY-y0,sp=Math.abs(dx)/(Date.now()-t0);
    if(Math.abs(dx)>(sp>.5?35:80)&&Math.abs(dx)>Math.abs(dy)*1.6){const n=S.tab+(dx<0?1:-1);if(n>=0&&n<TABS.length)setTab(n,dx<0?1:-1)}},{passive:true})})();

/* ---------- 11. Saisie, format décimal / scientifique, mémorisation ---------- */
function save(){const o={_t:S.tgt};$$('.val,.exp,.sel').forEach(e=>{if(e.value)o[e.id]=e.value});sto.s('bch_state',JSON.stringify(o))}
BC.addEventListener('input',e=>{const el=e.target;if(!el.matches('.val,.exp'))return;
  const re=el.matches('.exp')?/[^0-9+\-−]/g:/[^0-9.,eE+\-−×x^*]/g;if(re.test(el.value))el.value=el.value.replace(re,'');
  recalc();save()});
BC.addEventListener('change',e=>{if(e.target.matches('.sel')){buzz();recalc();save()}});
BC.addEventListener('keydown',e=>{const el=e.target;if(!el.matches('.val,.exp'))return;
  if(e.key==='Enter')el.blur();
  if(el.matches('.exp')&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();el.value=(parseInt(el.value,10)||0)+(e.key==='ArrowUp'?1:-1);el.dispatchEvent(new Event('input',{bubbles:true}))}});

  const tb=cur();if(S.tgt[tb.id]!==b.dataset.k)setTarget(tb,b.dataset.k,true)});
/* changement de format : toutes les valeurs sont réécrites à pleine précision */
function setFmt(f,init){applyFx();return;if(S.fmt===f&&!init)return;
  const vals=init?null:TABS.map(tb=>tb.vars.map(v=>readVal(tb.id,v.k)));
  if(!init)buzz();
  S.fmt=f;BC.dataset.fmt=f;sto.s('bch_fmt',f);segSet($('fmtSeg'),f==='sci'?1:0);
  if(vals)TABS.forEach((tb,i)=>tb.vars.forEach((v,j)=>{if('v' in vals[i][j])writeVal(tb.id,v.k,vals[i][j].v,12)}));
  if(!init){recalc();save()}}

/* ---------- 12. Unité composée : unités nommées en haut, puis deux molettes numérateur | dénominateur ---------- */
const upop=$('upop'),ROW=40;let ucap=null;
const setUnit=(b,u)=>{b.value=u;b.textContent=u};
function pickUnit(u){if(u===ucap.value)return;setUnit(ucap,u);ucap.dispatchEvent(new Event('change',{bubbles:true}))}
/* position des molettes : une unité nommée prend la combinaison équivalente (M → mol/L) */
function upPair(b){const dim=b.dataset.dim,d=D[dim],u=b.value,k=u.indexOf('/'),N=Object.keys(d.r[0]),Q=Object.keys(d.r[1]);
  if(!(u in d.u)&&k>0)return[u.slice(0,k),u.slice(k+1)];
  const f=fu(dim,u);for(const q of Q)for(const n of N)if(Math.abs(fu(dim,n+'/'+q)/f-1)<1e-9)return[n,q];return[N[0],Q[0]]}
const centerIdx=w=>Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/ROW)));
const toItem=(w,it,how)=>w.scrollTo({top:it.offsetTop-w.clientHeight/2+ROW/2,behavior:how});
function wheelPick(){if(!ucap)return;const[n,q]=[...upop.querySelectorAll('.up-wh')].map(w=>w.children[centerIdx(w)].dataset.k),[n0,q0]=upPair(ucap);
  if(n===n0&&q===q0)return;pickUnit(n+'/'+q);upop.querySelectorAll('.up-n .on').forEach(x=>x.classList.remove('on'))}
function upPlace(){const r=ucap.getBoundingClientRect(),w=upop.offsetWidth,h=upop.offsetHeight;
  upop.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';
  upop.style.top=(r.bottom+8+h<=innerHeight-8?r.bottom+8:Math.max(8,r.top-8-h>=8?r.top-8-h:innerHeight-8-h))+'px'}
function ulab(b){if(b.classList.contains('u0'))b.textContent=(FX[b.id.replace(/-u$/,'')]||FXD)==='sci'?'×10ⁿ':'1,5'}
const TOGFX=true;
function setFx(b,f){const vid=b.id.replace(/-u$/,''),i=vid.lastIndexOf('-'),tab=vid.slice(0,i),k=vid.slice(i+1);if((FX[vid]||FXD)===f)return;buzz();
  const r=readVal(tab,k);FX[vid]=f;sto.s(FXK,JSON.stringify(FX));applyFx();if('v' in r)writeVal(tab,k,r.v,12);
  const sg=upop.querySelector('.fseg');if(sg)segSet(sg,f==='sci'?1:0);recalc();save()}
function upOpen(b){ucap=b;const d=D[b.dataset.dim],named=Object.keys(d.u).filter(Boolean),comp=!!d.r,sci=(FX[b.id.replace(/-u$/,'')]||FXD)==='sci';
  const wheel=(o,s_)=>`<div class="up-wh">${Object.keys(o).map(k=>`<div class="up-it${k===s_?' on':''}" data-k="${k}">${k}</div>`).join('')}</div>`;
  let h=TOGFX?`<div class="upf"><span>Écriture</span><div class="seg fseg" style="--n:2;--i:${sci?1:0}"><i class="th"></i><button type="button" data-fx="std"${sci?'':' class="on"'}>1,5</button><button type="button" data-fx="sci"${sci?' class="on"':''}>1,5 × 10ⁿ</button></div></div>`:'';
  if(named.length>1||comp&&named.length)h+=`<div class="up-n">${named.map(k=>`<button type="button" data-u="${k}"${k===b.value?' class="on"':''}>${k}</button>`).join('')}</div>`;
  if(comp){const[n,q]=upPair(b);h+=`<div class="up-h"><span>${t(d.lab[0])}</span><span>${t(d.lab[1])}</span></div><div class="up-c"><i class="up-lens"></i>${wheel(d.r[0],n)}${wheel(d.r[1],q)}</div>`}
  if(!h)return;upop.innerHTML=h;upop.hidden=false;
  upop.querySelectorAll('.up-wh').forEach(w=>{toItem(w,w.querySelector('.on'),'instant');let tm=0;
    let last=centerIdx(w);w.addEventListener('scroll',()=>{const i=centerIdx(w);if(i!==last){last=i;buzz(8);[...w.children].forEach((c,j)=>c.classList.toggle('on',j===i))}clearTimeout(tm);tm=setTimeout(wheelPick,110)},{passive:true})});
  upPlace()}
const upClose=()=>{if(upop.hidden)return;ucap=null;if(RM||!window.bsUpOut){upop.hidden=true;return}bsUpOut(upop,()=>{if(!ucap)upop.hidden=true})};
document.addEventListener('click',e=>{const el=e.target;if(el.closest('[data-hap]'))return;
  if(!el.closest('.hact'))pops();
  const b=el.closest('.ucap');if(b){ucap===b?upClose():upOpen(b);return}
  const fxb=el.closest('#upop [data-fx]');if(fxb){if(ucap)setFx(ucap,fxb.dataset.fx);return}
  const o=el.closest('#upop [data-u]');if(o){pickUnit(o.dataset.u);upClose();return}
  const it=el.closest('.up-it');if(it){toItem(it.parentElement,it,'smooth');return}
  if(!el.closest('#upop'))upClose()});
addEventListener('resize',()=>{upClose();fit()});
addEventListener('scroll',()=>ucap&&upPlace(),{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape'){upClose();hist(false);pops()}});

  $$('[data-ph]').forEach(e=>e.placeholder=dec(e.dataset.ph));
  $$('#lmenu button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  nbs.forEach((b,i)=>b.lastElementChild.textContent=t('nav')[i]);
  $('rtt').innerHTML=t('tabs').map(x=>`<span>${x}</span>`).join('');
  renderHist();footLang();pops();
  if(S.tab>=0){shown=null;recalc()}}
$('langBtn').addEventListener('click',()=>{buzz(8);pops('lmenu')});
$('lmenu').addEventListener('click',e=>{const b=e.target.closest('button');if(b){buzz();setLang(b.dataset.l)}});
/* menu flottant (menu-flottant.js, chargé en fin de page) */
$('mb').addEventListener('click',()=>{buzz();let n=0;const go=()=>typeof window.openCapsuleMenu==='function'?window.openCapsuleMenu():++n<40&&setTimeout(go,100);go()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
/* reflet du verre qui suit le pointeur */
$$('.tools,.mb,.nav-in').forEach(b=>{
  const aim=e=>{const r=b.getBoundingClientRect();b.style.setProperty('--mx',e.clientX-r.left+'px');b.style.setProperty('--my',e.clientY-r.top+'px')};
  b.addEventListener('pointerenter',e=>{aim(e);b.classList.add('lit')});
  b.addEventListener('pointerdown',e=>{aim(e);b.classList.add('lit')});
  b.addEventListener('pointermove',aim);
  b.addEventListener('pointerleave',()=>b.classList.remove('lit'));
  ['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,e=>e.pointerType!=='mouse'&&b.classList.remove('lit')))});

/* ---------- 14. Copier, enregistrer, historique ---------- */
const bump=b=>{b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')};
$('bCopy').addEventListener('click',async()=>{if(!S.ok)return;const b=$('bCopy'),txt=S.last.eq;bump(b);
  try{await navigator.clipboard.writeText(txt)}
  catch(e){const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  buzz(OK);setBtn(b,'check','btn_copied',true);setTimeout(()=>setBtn(b,'copy','btn_copy'),1500)});
const saveHist=()=>sto.s('bioChemHistory',JSON.stringify(S.hist));
$('bSave').addEventListener('click',()=>{if(!S.ok)return;const{from,to}=S.last,b=$('bSave'),h=S.hist[0];bump(b);buzz(OK);
  if(!(h&&h.from===from&&h.to===to&&h.tab===S.tab)){S.hist.unshift({tab:S.tab,from,to});S.hist.length=Math.min(S.hist.length,30);saveHist();renderHist();$('badge').classList.add('on')}
  setBtn(b,'check','btn_saved',true)});
function renderHist(){$('hl').innerHTML=S.hist.length?S.hist.map((h,i)=>`<div class="hi" style="animation-delay:${Math.min(i,8)*40}ms"><div><div class="ht">${esc(t('tabs')[h.tab]||'')}</div><div class="hd">${esc(h.from)} → <b>${esc(h.to)}</b></div></div><button class="hdel" data-i="${i}" aria-label="${t('t_del')}">${IC.close}</button></div>`).join('')
  :`<div class="hempty">${t('hist_empty')}</div>`}
function hist(on){if(on!==$('ov').classList.contains('on'))buzz(8);$('ov').classList.toggle('on',on);if(on)$('badge').classList.remove('on')}
$('hl').addEventListener('click',e=>{const b=e.target.closest('.hdel');if(b){buzz();S.hist.splice(+b.dataset.i,1);saveHist();renderHist()}});
$('histBtn').addEventListener('click',()=>hist(true));
$('hClose').addEventListener('click',()=>hist(false));
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))hist(false)});
$('hClr').addEventListener('click',()=>{buzz(OK);S.hist=[];sto.d('bioChemHistory');renderHist()});

/* ---------- 15. Démarrage ---------- */
applyTheme();
try{S.hist=JSON.parse(sto.g('bioChemHistory'))||[]}catch(e){S.hist=[]}
setFmt(sto.g('bch_fmt')==='sci'?'sci':'std',true);
let st={};try{st=JSON.parse(sto.g('bch_state'))||{}}catch(e){}
Object.entries(st).forEach(([id,v])=>{const e=id[0]!=='_'&&typeof v==='string'&&$(id);if(!e||!BC.contains(e))return;
  if(e.tagName==='SELECT'){if([...e.options].some(o=>o.value===v))e.value=v}
  else if(e.classList.contains('ucap')){if(fu(e.dataset.dim,v)>0)setUnit(e,v)}
  else e.value=v});
TABS.forEach(tb=>{const k=st._t&&st._t[tb.id];setTarget(tb,tb.vars.some(v=>v.k===k)?k:S.tgt[tb.id])});
setLang(sto.g('bc_lang')||((navigator.language||'fr').startsWith('fr')?'fr':'en'));
const t0=parseInt(sto.g('bch_tab'),10);setTab(t0>=0&&t0<TABS.length?t0:0,1);
/* pied de page : placé dans la page, sous le contenu, et traduit */
applyFx();
document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('.modern-transparent-footer');if(f){$('shell').appendChild(f);footLang()}});
})();
</script>
<script src="/menu-flottant.js"></script>
</body>
</html>
