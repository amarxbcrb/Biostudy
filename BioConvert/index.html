<script>
/* thème avant le premier rendu : choix mémorisé pour la période (jour / nuit) en cours, sinon celui du système */
(()=>{const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},h=new Date().getHours(),th=g('bioConvertTheme');
document.documentElement.dataset.theme=th&&g('bioConvertThemePeriod')===(h>=7&&h<20?'day':'night')?th:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'})();
</script>
<style>
/* TABLE DES MATIÈRES
    1. Jetons : palette Réglages iOS (clair #f2f2f7 / groupes blancs ; sombre noir / groupes #1c1c1e)
    2. Verre (barres, menus, historique) : un seul style, reflet qui suit la souris
    3. En-tête
    4. Page : saisie puis résultat
    5. Barre d'onglets (façon BioCampus) et résultat flottant
    6. Historique (verre), choix d'unité composée (molettes façon horloge)
    7. Pied de page (footer-global.js) : dans le flux, sous le contenu
    8. Adaptations
    9. BioDilu : options, étapes à la demande, schéma animé
   10. Formule et aide : repliées, déployées avec animation
   11. Liquid glass sur toute l'interface (même verre que la barre de navigation)
   12. Sombre AMOLED : noir pur, cartes en verre translucide
   13. Fenêtre d'unité : grille régulière de capsules
   14. Mode clair : palette affinée (contrastes, accents, verre plus net)
   15. Mode clair : fond neutre (plus de bleu)
   16. Apparition de la capsule résultat
   17. Capsule résultat : entrée façon Apple (ressort, flou → net, reflet qui balaie)
   18. Mode clair : liquid glass bien visible
   19. Mode clair façon iOS 27 : fond uni, verre plat et lisible, sans effet 3D
   20. Mode sombre AMOLED : même verre plat (iOS 27), sans effet 3D
   21. Capsule résultat : la capsule elle-même se déploie (forme + taille), puis le texte arrive
   22. « Grandeur recherchée » : même verre et même lentille que la barre de navigation
   Résultat flottant au-dessus du clavier : sections 5 (.mini) — classe html.kb posée par le JS (section 13).
*/
/* ===== 1. Jetons : palette Réglages iOS (clair #f2f2f7 / groupes blancs ; sombre noir / groupes #1c1c1e) ===== */
#bc{--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);
--top:70px;--gx:14px;--navh:60px;--blur:22px;
--grp:#fff;--fill:rgba(118,118,128,.12);--thumb:#fff;--tx:#000;--tx2:#6c6c70;--tx3:#8a8a8e;--sep:rgba(60,60,67,.18);
--acc:var(--c-blue);--acc-tx:color-mix(in srgb,var(--acc) 78%,#000);--brand:#0064d2;
--c-blue:#007aff;--c-indigo:#5856d6;--c-purple:#af52de;--c-pink:#ff2d55;--c-orange:#ff9500;--c-green:#34c759;--c-teal:#30b0c7;--c-cyan:#32ade6;--c-mint:#00c7be;--c-brown:#a2845e;
--ok:#1f8a3b;--err:#d70015;--warn:#ff9500;
--lg-rgb:255,255,255;--lg-a:.68;--lg-hi:#fff;--lg-sh:rgba(0,0,0,.12);--hair:rgba(0,0,0,.09);
--fb:rgba(60,60,67,.3);--lens:rgba(120,120,128,.16);--lens-line:rgba(255,255,255,.9);--veil:rgba(0,0,0,.22);--blob:.3;
color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.4}
[data-theme=dark] #bc{--grp:#1c1c1e;--fill:#2c2c2e;--thumb:#636366;--tx:#fff;--tx2:#a1a1a6;--tx3:#8e8e93;--sep:rgba(84,84,88,.6);
--acc-tx:color-mix(in srgb,var(--acc) 72%,#fff);--brand:#4da3ff;
--c-blue:#0a84ff;--c-indigo:#5e5ce6;--c-purple:#bf5af2;--c-pink:#ff375f;--c-orange:#ff9f0a;--c-green:#30d158;--c-teal:#40cbe0;--c-cyan:#64d2ff;--c-mint:#63e6e2;--c-brown:#ac8e68;
--ok:#30d158;--err:#ff453a;
--lg-rgb:28,28,30;--lg-a:.66;--lg-hi:rgba(255,255,255,.34);--lg-sh:rgba(0,0,0,.5);--hair:rgba(255,255,255,.08);
--fb:rgba(235,235,245,.26);--lens:rgba(255,255,255,.17);--lens-line:rgba(255,255,255,.26);--veil:rgba(0,0,0,.5);--blob:0}
/* accent par onglet : C1V1 bleu, au 1/n sarcelle, série indigo, UFC orange, gamme rose */
#bc{--acc:var(--c-orange)}#bc[data-tab="1"]{--acc:var(--c-cyan)}#bc[data-tab="2"]{--acc:var(--c-blue)}#bc[data-tab="3"]{--acc:var(--c-purple)}#bc[data-tab="4"]{--acc:var(--c-pink)}
#bc .nb:nth-of-type(1){--nc:var(--c-orange)}#bc .nb:nth-of-type(2){--nc:var(--c-cyan)}#bc .nb:nth-of-type(3){--nc:var(--c-blue)}#bc .nb:nth-of-type(4){--nc:var(--c-purple)}#bc .nb:nth-of-type(5){--nc:var(--c-pink)}
@media(min-width:600px){#bc{--gx:24px;--top:80px}}
@media(min-width:900px){#bc{--gx:36px;--top:92px}}
html{background:#f2f2f7;color-scheme:light;-webkit-text-size-adjust:100%;overflow-x:clip;overscroll-behavior:none;transition:background .4s}
html[data-theme=dark]{background:#000;color-scheme:dark}
body{margin:0;min-height:100dvh;overflow-x:clip;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#bc::before{content:"";position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:var(--blob);filter:blur(60px);animation:flow 20s ease-in-out infinite alternate;
background:radial-gradient(circle at 20% 30%,rgba(10,132,255,.5),transparent 40%),radial-gradient(circle at 80% 70%,rgba(94,92,230,.25),transparent 40%),radial-gradient(circle at 50% 10%,rgba(142,142,147,.15),transparent 40%)}
@keyframes flow{to{transform:translate(-4%,3%) rotate(8deg)}}
:where(#bc) *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:where(#bc) :is(button,input,select){font:inherit;color:inherit}
:where(#bc) button{border:0;background:none;cursor:pointer;touch-action:manipulation}
#bc :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bc :is(input,select):focus-visible{outline:none}
#bc [hidden]{display:none!important}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ===== 2. Verre (barres, menus, historique) : un seul style, reflet qui suit la souris ===== */
.glass{position:relative;background:rgba(var(--lg-rgb),var(--lg-a));-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);
box-shadow:inset 0 1px 0 var(--lg-hi),0 0 0 .5px var(--hair),0 12px 30px var(--lg-sh)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
background:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 70%)}
.glass.lit::after{opacity:1}
@media(prefers-reduced-transparency:reduce){.glass{background:var(--grp);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ===== 3. En-tête ===== */
header{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top);pointer-events:none}
.hin{max-width:1080px;margin:auto;padding:12px var(--gx);display:flex;justify-content:space-between;align-items:center;gap:8px;animation:drop .7s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}}
.logo-c{flex:1;min-width:0;pointer-events:auto}
.logo{font-size:clamp(1.45rem,6.4vw,1.9rem);font-weight:800;letter-spacing:-.6px;line-height:1;white-space:nowrap}
.logo i{font-style:normal;color:var(--brand)}
.sub{font-size:.75rem;font-weight:600;color:var(--tx2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hact{pointer-events:auto;display:flex;align-items:center;gap:8px;position:relative}
.tools{height:48px;padding:0 4px;border-radius:999px;display:flex;align-items:center;gap:2px}
.tb,.mb{display:grid;place-items:center;border-radius:50%;font-size:20px;transition:transform .35s var(--spring),background .3s}
.tb{width:40px;height:40px;position:relative;z-index:1}
.mb{width:48px;height:48px}
.tb:active{transform:scale(.86);background:var(--fill)}
.mb:active{transform:scale(.88)}
@media(hover:hover){.tb:hover{background:var(--fill)}.mb:hover{transform:scale(1.06)}}
.badge{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--warn);transform:scale(0);transition:transform .35s var(--spring)}
.badge.on{transform:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,10,.8)}70%,to{box-shadow:0 0 0 8px transparent}}
.pop{position:absolute;top:calc(100% + 10px);right:56px;padding:6px;border-radius:26px;display:none;flex-direction:column;transform-origin:top right}
.pop.on{display:flex;animation:pop .45s var(--spring)}
.lmenu{min-width:176px}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(-8px)}}
.lmenu button{position:relative;z-index:1;min-height:44px;padding:11px 16px;border-radius:999px;text-align:left;font-size:15px;font-weight:600}
.lmenu button:hover,.lmenu button.on{background:var(--fill);color:var(--acc-tx)}

/* ===== 4. Page : saisie puis résultat ===== */
.shell{min-height:100dvh;max-width:1080px;margin:auto;display:flex;flex-direction:column;
padding:calc(var(--top) + env(safe-area-inset-top)) var(--gx) calc(var(--navh) + 96px + env(safe-area-inset-bottom))}
.stage{flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-content:center;animation:rise .7s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media(min-width:900px){.stage{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px}}
.inputs{display:flex;flex-direction:column;min-width:0}
.thead{display:flex;align-items:center;gap:10px;margin:0 4px 14px}
.roll{height:38px;overflow:hidden}
.roll>div{transition:transform .8s var(--spring)}
.roll span{height:38px;display:grid;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnb{width:30px;flex-shrink:0;font-size:27px;color:var(--acc-tx)}
.rnb span{place-items:center}
.rttl{flex:1;min-width:0;font-size:clamp(22px,5vw,27px);font-weight:800;letter-spacing:-.6px}
.view{display:none}
.view.on{display:block}
/* en-têtes de groupe façon Réglages */
.gh{margin:20px 16px 7px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2)}
/* segments : la pastille se place en CSS (--i : index, --n : nombre) */
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--fill);--i:0;--n:2}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.18);
transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--spring)}
.seg button{flex:1;min-width:0;height:34px;position:relative;z-index:1;border-radius:999px;font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:color .3s,transform .35s var(--spring)}
.seg button:active{transform:scale(.94)}
.seg button.on{color:var(--tx)}
/* « Calculer » : symbole + nom court ; la grandeur choisie disparaît des valeurs connues */
.cal button{height:52px;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal b,.sym,.fl{font-family:var(--serif);font-style:italic;color:var(--acc-tx)}
.cal b{font-size:20px;line-height:1}
.cal small{max-width:100%;font-size:11px;overflow:hidden;text-overflow:ellipsis}
:is(.cal b,.sym,.fl) sub{font-size:.6em}
/* valeurs connues : un groupe, une ligne par grandeur ; seule l'unité est en capsule */
.grp{background:var(--grp);border-radius:22px;overflow:hidden}
.vr{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:58px;padding:8px 12px 8px 16px;transition:background .25s}
.vr:not([hidden])~.vr::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.vr:focus-within{background:color-mix(in srgb,var(--grp) 94%,var(--acc))}
.lb{flex:1 1 96px;min-width:0;display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:600;line-height:1.25}
.lb .ls{display:none}
@media(max-width:599px){.lb .ln{display:none}.lb .ls{display:inline}}
/* scientifique sur mobile : tout tient sur la ligne (champs plus compacts) */
@media(max-width:599px){.vr:has(>.ctl.sci) .lb{flex-basis:56px}.ctl.sci{gap:5px}.ctl.sci .val{flex-basis:78px;width:78px;padding:0 10px;font-size:17px}
.ctl.sci .exp{flex-basis:42px;width:42px}.ctl.sci .sel{flex-basis:92px;width:92px;padding:0 22px 0 11px;font-size:14px;background-position:right 8px center}}
.sym{flex-shrink:0;min-width:28px;height:28px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;align-self:center;background:var(--sc);color:#fff;font-size:16px;font-weight:700;line-height:1;white-space:nowrap}
.lb{align-items:center}
.ctl{flex:1 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px}
/* champs modifiables : capsule bordée teintée (les unités restent des capsules grises à chevron) */
.val,.exp{border:1.5px solid var(--fb);background:transparent;border-radius:999px;font-weight:600;cursor:text;
transition:border-color .2s,box-shadow .2s,background .2s}
.val{flex:0 0 112px;width:112px;min-width:0;height:42px;padding:0 14px;font-size:19px;text-align:right}
.ctl.sci .val{flex-basis:92px;width:92px}
.exp{flex:0 0 52px;width:52px;height:38px;font-size:16px;text-align:center}
.val:focus,.exp:focus{border-color:var(--acc);background:var(--grp);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.val::placeholder,.exp::placeholder{color:var(--tx3);font-weight:500}
.ctl:not(.sci) :is(.x10,.exp){display:none}
.x10{font-size:13px;font-weight:700;color:var(--tx2)}
.ctl:not(.sci) :is(.x10,.exp){display:none}
.sel{flex:0 0 108px;width:108px;height:38px;padding:0 28px 0 14px;border:0;border-radius:999px;appearance:none;-webkit-appearance:none;cursor:pointer;
background:var(--fill) url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8f9b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e") no-repeat right 10px center/12px;
font-size:15px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .3s var(--spring)}
.sel:active{transform:scale(.97)}
.sel:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.sel option{background:var(--grp);color:var(--tx)}
.sel.one{background-image:none;padding-right:14px;pointer-events:none}
.sel.ghost{visibility:hidden}#ru .ghost{display:none}
.fl{margin:12px 0 0;padding:12px 20px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);font-size:22px;font-weight:600;font-style:normal}
.fl small{font:700 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.5px;text-transform:uppercase;color:var(--acc-tx);opacity:.8}
.fl span{font-style:italic;white-space:nowrap}
.fl.hit{animation:lawpop .45s var(--spring)}
@keyframes lawpop{40%{transform:scale(1.04)}}
/* résultat : valeur + unité (capsule), équation, actions */
.results{display:flex;flex-direction:column;min-width:0}
.results>.gh{margin-top:0}
.rg{background:var(--grp);border-radius:22px;overflow:hidden;text-align:center}
.rv{min-height:92px;padding:22px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.num{font-size:clamp(32px,10vw,44px);font-weight:800;letter-spacing:-1px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
#ru .sel{flex:none;width:auto;height:42px;padding:0 34px 0 16px;background-position:right 12px center;font-size:20px;font-weight:700;color:var(--acc-tx)}
.eq{padding:0 16px 16px;font-size:14px;font-weight:500;color:var(--tx2);line-height:1.45;overflow-wrap:anywhere}
.acts{display:flex;border-top:.5px solid var(--sep)}
.ab{flex:1;height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;color:var(--acc-tx);transition:opacity .2s,color .2s}
.ab+.ab{border-left:.5px solid var(--sep)}
.ab .ic{font-size:17px}
.ab:active{opacity:.5}
.ab:disabled{opacity:.35;pointer-events:none}
.ab.ok{color:var(--ok)}
.bump{animation:bump .55s var(--spring)}
@keyframes bump{40%{transform:scale(1.07)}}
.tip{margin:10px 16px 0;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.45}
.tip:empty{display:none}
.tip .ic{margin-top:2px;font-size:15px}
.tip.err{color:var(--err);font-weight:600}
.tip.warn{color:var(--warn);font-weight:600}
.tip span{white-space:pre-line}

/* ===== 5. Barre d'onglets (façon BioCampus) et résultat flottant ===== */
.nav{position:fixed;z-index:30;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:440px;height:var(--navh);margin-inline:auto;border-radius:999px;
animation:navin .8s var(--ease) backwards .2s}
@keyframes navin{from{opacity:0;translate:0 40px;scale:.94}}
@keyframes navin-d{from{opacity:0;translate:0 -30px;scale:.94}}
.nav-in{height:100%;padding:5px;border-radius:999px;display:flex;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.nav-in.dragging{cursor:grabbing}
.sl{position:absolute;top:5px;bottom:5px;left:0;width:80px;z-index:1;border-radius:999px;pointer-events:none;translate:5px 0;
background:var(--lens);border:1px solid var(--lens-line);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.14);
transition:translate .6s var(--spring),width .3s var(--ease),scale .3s var(--spring)}
.sl.interacting{scale:1.06 1.12}
.dragging .sl{transition:scale .25s var(--spring)}
.nb{flex:1;position:relative;z-index:2;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
font-size:.66rem;font-weight:500;color:var(--tx2);white-space:nowrap;transition:color .3s,transform .45s var(--spring)}
.nb:active{transform:scale(.92)}
.nb .ic{font-size:20px}
.nb.on{color:var(--acc-tx);font-weight:600}
.nb .ic{color:var(--nc);opacity:.75;transition:opacity .3s}.nb.on .ic{opacity:1}
.nb.on .ic{animation:ipop .35s var(--ease)}
@keyframes ipop{from{transform:scale(.85)}}
.mini{position:fixed;z-index:29;left:12px;right:12px;max-width:440px;margin-inline:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + var(--navh) + 10px);
min-height:46px;padding:8px 18px;border-radius:999px;display:flex;align-items:baseline;justify-content:center;gap:8px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
opacity:0;translate:0 16px;pointer-events:none;transition:opacity .3s,translate .45s var(--spring)}
.mini.on{opacity:1;translate:0;pointer-events:auto}
/* clavier ouvert (classe html.kb, posée par le JS section 13) : capsule juste au-dessus du clavier (top calculé en JS),
   barre d'onglets masquée, marge en bas pour pouvoir faire défiler le champ au-dessus de la capsule */
html.kb .mini{bottom:auto;translate:0;transition:opacity .2s;z-index:50}
html.kb .nav{visibility:hidden}
html.kb body{padding-bottom:45vh}
.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ml{font:italic 700 17px var(--serif);color:var(--acc-tx)}
.mini .mu{font-size:16px;color:var(--acc-tx)}

/* ===== 6. Historique (verre), choix d'unité composée (molettes façon horloge) ===== */

html[data-theme=light] #bc .vr :is(.exp,.sel){background:rgba(0,0,0,.05)!important;border:1px solid rgba(0,0,0,.04)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)!important}
/* commandes en verre interactives (équivalent de .glassEffect(.regular.interactive())) */
#bc :is(.tools .tb,.mb,.swap,.acts .ab,.nb,.fh,.vr .sel){transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .2s,background-color .2s}
#bc :is(.tools .tb,.mb,.acts .ab,.vr .sel):active{transform:scale(.94);filter:brightness(1.25)}
#bc .swap:active{filter:brightness(1.3)}
#bc .fh:active{background:rgba(255,255,255,.06)}

/* cibles d'au moins 44 px */
#bc .tools .tb{min-width:44px;min-height:44px}
/* Enregistrer = verre normal, texte neutre ; l'orange reste pour l'action principale */
#bc.cv .acts .ab:not(:first-child){color:var(--tx)!important}
#bc.cv .acts .ab:not(:first-child) .ic{color:var(--acc-tx)}
/* accessibilité */
@media (prefers-reduced-transparency:reduce){
 #bc :is(.tools,.mb,.nav-in,.swap){-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#1c1c1e!important}
 html[data-theme=light] #bc :is(.tools,.mb,.nav-in,.swap){background:#fff!important}}
@media (prefers-contrast:more){
 html{--gl-bd:1px solid rgba(255,255,255,.4)}html[data-theme=light]{--gl-bd:1px solid rgba(0,0,0,.35)}
 #bc :is(.fold,.grp,.vr .val,.vr .sel,.vr .exp){border-color:currentColor!important}}
@media (prefers-reduced-motion:reduce){#bc *,#bc *::before,#bc *::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<body>
<div id="bc" data-fmt="std">

<header><div class="hin">
  <div class="logo-c"><div class="logo">Bio<i>Convert</i></div><div class="sub" data-key="subtitle"></div></div>
  <div class="hact">

    </section>

        <div class="msec"><p class="gh" data-key="h_steps"></p><div class="grp" id="mSteps"></div></div>
        <div class="msec full" id="mHowW"><p class="gh" data-key="h_how"></p><div class="grp"><div id="mSchW"><div class="sch" id="mSch"></div><p class="cap" id="mCap"></p></div><div id="mHow"></div></div></div>
        <div class="msec" id="mNotesW"><p class="gh" data-key="h_notes"></p><div class="grp" id="mNotes"></div></div>

  <script src="/footer-global.js"></script>

<script>
(()=>{'use strict';
/* ---------- 1. Outils ---------- */
const $=id=>document.getElementById(id),BC=$('bc'),root=document.documentElement;
const $$=(s,c=BC)=>[...c.querySelectorAll(s)];
const sto={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VV=window.visualViewport;   // zone réellement visible (change quand le clavier s'ouvre)
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
/* retour haptique : vibration courte (Android), sinon interrupteur natif caché (iPhone, iOS 18+) */
function buzz(p=14){try{if(navigator.vibrate){navigator.vibrate(p);return}if(!IOS)return;
  const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');
  l.dataset.hap='';l.style.display='none';l.appendChild(i);document.head.appendChild(l);l.click();l.remove()}catch(e){}}
const OK=[12,60,18];

/* ---------- 2. Icônes : Lucide (ISC) ---------- */
const IC=Object.fromEntries(Object.entries({
  calc:'<rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>',
  beaker:'<path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/>',
  tubes:'<path d="M9 2v17.5A2.5 2.5 0 0 1 6.5 22A2.5 2.5 0 0 1 4 19.5V2"/><path d="M20 2v17.5a2.5 2.5 0 0 1-2.5 2.5a2.5 2.5 0 0 1-2.5-2.5V2"/><path d="M3 2h7"/><path d="M14 2h7"/><path d="M9 16H4"/><path d="M20 16h-5"/>',
  bars:'<path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/>',
  list:'<path d="m6 9 6 6 6-6"/>',
  tip:'<path d="M12 22 8 7h8z"/><path d="M7 2h10v5H7z"/>',
  mix:'<path d="M21 12a9 9 0 1 1-6.22-8.56"/><path d="M21 3v5h-5"/><circle cx="12" cy="12" r="2.5"/>',
  tube:'<path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5c-1.4 0-2.5-1.1-2.5-2.5V2"/><path d="M8.5 2h7"/><path d="M14.5 16h-5"/>',
  tag:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/>',
  order:'<path d="M10 12h11"/><path d="M10 18h11"/><path d="M10 6h11"/><path d="M4 10h2"/><path d="M4 6h1v4"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  flask:'<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',minus:'<path d="M5 12h14"/>',
  scale:'<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  dish:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="9.5" r="1.3"/><circle cx="14.8" cy="9" r="1"/><circle cx="13.2" cy="14.6" r="1.5"/><circle cx="8.6" cy="15" r=".9"/>',
  cuv:'<path d="M8 2h8"/><path d="M9 2v18a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V2"/><path d="M9 12h6"/><path d="M2 8h4"/><path d="M18 8h4"/>',
  pip:'<path d="m12 9-8.4 8.4A2 2 0 0 0 3 18.8v1.4a2 2 0 0 1-.6 1.4 2 2 0 0 1 1.4-.6h1.4a2 2 0 0 0 1.4-.6L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/>',
  grow:'<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
  hist:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  lang:'<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon:'<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>',
  dl:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  menu:'<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  save:'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  close:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'
}).map(([k,d])=>[k,`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`]));


/* ---------- 3. Textes ---------- */
const T={fr:{subtitle:"Conversion d'unités de labo",fmt_std:"Décimale",fmt_sci:"Scientifique",calc:"Grandeur recherchée",known:"Données",law:"Relation",h_par:"Options",h_steps:"Détail du calcul",h_how:"Pas à pas",h_notes:"Bon à savoir",
cta_t:"Détail",cta_t2:"Masquer",cta_s:"",
u_mass:"Masse",u_vol:"Volume",a_exp:"Exposant (puissance de 10)",a_unit:"Unité",
btn_copy:"Copier",btn_copied:"Copié",btn_save:"Enregistrer",btn_saved:"Enregistré",
hist_title:"Historique",hist_empty:"Aucune conversion enregistrée.",hist_clear:"Effacer l'historique",
t_hist:"Historique",t_theme:"Changer le thème",t_menu:"Menu",t_close:"Fermer",t_del:"Supprimer",
wait:"En attente de saisie",tip_wait:"Saisissez les données : la conversion s'affiche dès que tout est rempli.",
bad:"Format non valide",tip_bad:"Nombre non reconnu. Écrivez par exemple 10 ; 1,5 ; 2e-3 ; 2×10^-3 ou 1/1000 (exposant : nombre entier).",
neg:"Valeur négative",tip_neg:"Une grandeur ne peut pas être négative. Saisissez une valeur positive, sans signe −.",
zero:"Calcul impossible",tip_zero:"Une valeur nulle se retrouve au dénominateur. Remplacez le 0 par une valeur non nulle.",
ovf:"Résultat hors limites",tip_ovf:"Le résultat est trop grand ou trop petit pour être calculé. Vérifiez les valeurs et leurs unités.",
fam:"Masse molaire non calculable",tip_fam:"Pour calculer M, une concentration doit être molaire (M, mM…) et l'autre massique (g/L, mg/mL, %…).",
foot_dev:"Design & Développement",
nav:["Masse","Volume","Concentration","Quantité"],
tabs:["Convertir une masse","Convertir un volume","Convertir une concentration","Quantité de matière et masse"],
v_a:"Valeur à convertir",s_a:"Valeur",v_b:"Valeur convertie",s_b:"Résultat",
v_ca:"Concentration de départ",s_ca:"Départ",v_cb:"Concentration convertie",s_cb:"Résultat",v_M:"Masse molaire",s_M:"M",
v_n:"Quantité de matière",s_n:"Quantité",v_m:"Masse",s_m:"Masse"}};
T.en=T.fr;
const S={lang:'fr',dark:root.dataset.theme==='dark',fmt:'std',tab:-1,tgt:{},ok:false,last:null,hist:[],par:{},more:false,ctx:null,rdim:''};
const t=k=>T.fr[k]!=null?T.fr[k]:k,tv=(k,v)=>t(k).replace('{v}',v);

/* ---------- 4. Unités : base g, L, mol/L ou g/L, mol ---------- */
const MASS={kg:1e3,g:1,mg:1e-3,'µg':1e-6,ng:1e-9,pg:1e-12},VOLc={L:1,dL:.1,mL:1e-3,'µL':1e-6,nL:1e-9};
const D={mass:{u:{t:1e6,kg:1e3,g:1,mg:1e-3,'µg':1e-6,ng:1e-9,pg:1e-12,fg:1e-15}},
  vol:{u:{kL:1e3,L:1,dL:.1,cL:.01,mL:1e-3,'µL':1e-6,nL:1e-9,pL:1e-12,fL:1e-15}},
  conc:{u:{M:1,mM:1e-3,'µM':1e-6,nM:1e-9,pM:1e-12,fM:1e-15,'% (m/V)':10,ppm:1e-3,ppb:1e-6},r:[MASS,VOLc,1],lab:['u_mass','u_vol']},
  mm:{u:{'g/mol':1,kDa:1e3}},mol:{u:{mol:1,mmol:1e-3,'µmol':1e-6,nmol:1e-9,pmol:1e-12,fmol:1e-15}}};
function fu(dim,u){const d=D[dim];if(u in d.u)return d.u[u];const k=u.indexOf('/');
  if(d.r&&k>0){const n=d.r[0][u.slice(0,k)],q=d.r[1][u.slice(k+1)];if(n&&q)return n/q*d.r[2]}return NaN}
const FAM=u=>/^(M|mM|µM|nM|pM|fM)$/.test(u)?'mol':'mass';

/* ---------- 5. Convertisseurs ---------- */
const V=(k,s,dim,u,n,ph,sh)=>({k,s,dim,u,n,ph,sh:sh||s});
const DC={mass:'orange',vol:'cyan',conc:'blue',mm:'indigo',mol:'purple'};
const sb=(a,b)=>`${a}<sub>${b}</sub>`;
/* facteur entre les deux unités : « multiplier par 1 000 » */
function facTip(dim,ua,ub){const f=fu(dim,ua)/fu(dim,ub);if(!(f>0))return'';if(Math.abs(f-1)<1e-12)return'Unités équivalentes : la valeur ne change pas.';
  return f>1?`Multiplier par ${fmt(f)}`:`Diviser par ${fmt(1/f)}`}
const conv=(id,ic,dim,ua,ub,ph)=>({id,ic,tgt:'b',conv:1,
  vars:[V('a',sb('x','1'),dim,ua,'a',ph,sb('x','1')),V('b',sb('x','2'),dim,ub,'b','',sb('x','2'))],
  f:{b:`${sb('x','2')} = ${sb('x','1')} · facteur`,a:`${sb('x','1')} = ${sb('x','2')} / facteur`},
  solve:{b:x=>x.a,a:x=>x.b},note:(x,c)=>facTip(dim,c.U.a,c.U.b),
  more(c){return{steps:`${fmt(c.x.a/fu(dim,c.U.a))} ${c.U.a} = <b>${fmt(c.x.b/fu(dim,c.U.b))} ${c.U.b}</b>\n${facTip(dim,c.U.a,c.U.b)}`}}});
const TABS=[conv('mass','scale','mass','g','mg','1'),conv('vol','beaker','vol','L','mL','1'),
{id:'conc',ic:'tubes',tgt:'b',conv:1,
 vars:[V('a','C₁','conc','g/L','ca','50',sb('C','1')),V('M','M','mm','g/mol','M','58,44'),V('b','C₂','conc','mM','cb','',sb('C','2'))],
 f:{b:`C (g/L) = C (mol/L) · M`,a:`C (g/L) = C (mol/L) · M`,M:`M = C (g/L) / C (mol/L)`},
 skip:U=>FAM(U.a)===FAM(U.b)?['M']:[],
 solve:{b:(x,c)=>{const A=FAM(c.U.a),B=FAM(c.U.b);return A===B?x.a:A==='mol'?x.a*x.M:x.a/x.M},
   a:(x,c)=>{const A=FAM(c.U.a),B=FAM(c.U.b);return A===B?x.b:A==='mol'?x.b/x.M:x.b*x.M},
   M:(x,c)=>FAM(c.U.a)==='mol'?x.b/x.a:x.a/x.b},
 note:(x,c)=>FAM(c.U.a)===FAM(c.U.b)?facTip('conc',c.U.a,c.U.b):'Conversion mol/L ↔ g/L avec la masse molaire : γ = C · M.',
 more(c){const x=c.x,U=c.U;return{steps:`${fmt(x.a/fu('conc',U.a))} ${U.a} = <b>${fmt(x.b/fu('conc',U.b))} ${U.b}</b>${FAM(U.a)!==FAM(U.b)?`\navec M = ${fmt(x.M)} g/mol`:''}`}}},
{id:'qty',ic:'calc',tgt:'m',
 vars:[V('n','n','mol','mmol','n','1'),V('M','M','mm','g/mol','M','58,44'),V('m','m','mass','g','m','')],
 f:{m:'m = n · M',n:'n = m / M',M:'M = m / n'},
 solve:{m:x=>x.n*x.M,n:x=>x.m/x.M,M:x=>x.m/x.n},
 more(c){const x=c.x;return{steps:`m = n · M = ${fmt(x.n)} mol · ${fmt(x.M)} g/mol = <b>${fmt(x.m)} g</b>`}}}];
TABS.forEach(tb=>S.tgt[tb.id]=tb.tgt);
/* icône concentration : goutte */
IC.drop='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7 6.5 10a7 7 0 1 0 11 0z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg>';
TABS[2].ic='drop';
/* relations écrites en toutes lettres */
const conv_f={b:'Valeur convertie = valeur de départ × facteur',a:'Valeur de départ = valeur convertie ÷ facteur'};
Object.assign(TABS[0].f,conv_f);Object.assign(TABS[1].f,conv_f);
Object.assign(TABS[2].f,{b:'g/L = mol/L × masse molaire (M)\nmol/L = g/L ÷ masse molaire (M)',a:'g/L = mol/L × masse molaire (M)\nmol/L = g/L ÷ masse molaire (M)',M:'Masse molaire = concentration en g/L ÷ concentration en mol/L'});
Object.assign(TABS[3].f,{m:'Masse = quantité de matière × masse molaire',n:'Quantité de matière = masse ÷ masse molaire',M:'Masse molaire = masse ÷ quantité de matière'});
T.fr.law='Formule';
T.fr.tip_wait='Remplissez les champs ci-dessus : le résultat s’affiche automatiquement.';

const cur=()=>TABS[S.tab];

/* ---------- 6. Nombres : lecture souple, affichage à 4 chiffres significatifs ---------- */
const sup=s=>String(s).replace(/./g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]||({'-':'⁻','+':'⁺'}[c]||c));
const clean=n=>Number.isFinite(n)&&n!==0?Number(n.toPrecision(12)):n;
const dec=s=>S.lang==='fr'?s.replace('.',','):s;
const grp=s=>{const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');return p.join('.')};
function sciStr(c){const[m,e]=c.toExponential(11).split('e'),k=+e,mt=dec(String(Number(m)));return k?`${mt} × 10${sup(k)}`:mt}
function fmt(n){if(!Number.isFinite(n))return'-';if(n===0)return'0';const c=Number(n.toPrecision(4)),a=Math.abs(c);
  return S.rsci||a<1e-4||a>=1e6?sciStr(c):dec(grp(String(c)))}
/* valeur saisie telle quelle dans l'équation (pleine précision) */
const echo=v=>{if(v===0)return'0';const c=clean(v),a=Math.abs(c);return !S.rsci&&a>=1e-6&&a<1e21?dec(String(c)):sciStr(c)};
/* saisie : virgule ou point, 2e-3, 2×10^-3, 2x10-3 */

  if(/[e×x*^\/:⁰¹²³⁴⁵⁶⁷⁸⁹⁻]|^\s*10\s*[−–-]\s*\d/i.test(raw))return r;   // puissance déjà écrite dans le champ (8x10^-2, 1e6, 1/1000) : l'exposant à côté est ignoré

function readPar(tb){const P={...(tb.def||{}),...(S.par[tb.id]||{})};
  (tb.params||[]).filter(p=>p.t==='num').forEach(p=>{const r=readVal(tb.id,p.k);P[p.k]='v' in r&&r.v>0?r.v*fu(p.dim,$(`${tb.id}-${p.k}-u`).value):null});return P}
function recalc(){BC.classList.toggle('cv',!!cur().conv);S.rsci=isSci(cur().id,S.tgt[cur().id]);
  const tb=cur(),id=tb.id,k=S.tgt[id],kv=tb.vars.find(v=>v.k===k),un=$(`${id}-${k}-u`).value,x={},parts=[],U={};
  tb.vars.forEach(v=>U[v.k]=$(`${id}-${v.k}-u`).value);
  const sk=tb.skip?tb.skip(U):[];tb.vars.forEach(v=>$(`${id}-r-${v.k}`).classList.toggle('off',sk.includes(v.k)&&v.k!==k));

/* ---------- 12. Unité composée : unités nommées en haut, puis deux molettes numérateur | dénominateur ---------- */
const upop=$('upop'),ROW=40;let ucap=null;
const setUnit=(b,u)=>{b.value=u;b.textContent=u};
function pickUnit(u){if(u===ucap.value)return;setUnit(ucap,u);ucap.dispatchEvent(new Event('change',{bubbles:true}))}
/* position des molettes : une unité nommée prend la combinaison équivalente (M → mol/L) */
function upPair(b){const dim=b.dataset.dim,d=D[dim],u=b.value,k=u.indexOf('/'),N=Object.keys(d.r[0]),Q=Object.keys(d.r[1]);
  if(!(u in d.u)&&k>0)return[u.slice(0,k),u.slice(k+1)];
  const f=fu(dim,u);for(const q of Q)for(const n of N)if(Math.abs(fu(dim,n+'/'+q)/f-1)<1e-9)return[n,q];return[N[0],Q[0]]}
const centerIdx=w=>Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/ROW)));
const toItem=(w,it,how)=>w.scrollTo({top:it.offsetTop-w.clientHeight/2+ROW/2,behavior:how});
function wheelPick(){if(!ucap)return;const[n,q]=[...upop.querySelectorAll('.up-wh')].map(w=>w.children[centerIdx(w)].dataset.k),[n0,q0]=upPair(ucap);
  if(n===n0&&q===q0)return;pickUnit(n+'/'+q);upop.querySelectorAll('.up-n .on').forEach(x=>x.classList.remove('on'))}
/* position : dans la zone réellement visible (au-dessus du clavier s'il est encore ouvert) */
function upPlace(){
  if(!ucap)return;
  const M=8,top=VV?VV.offsetTop:0,bottom=top+(VV?VV.height:innerHeight),
        r=ucap.getBoundingClientRect(),w=upop.offsetWidth,h=upop.offsetHeight;
  upop.style.left=Math.max(M,Math.min(innerWidth-w-M,r.right-w))+'px';
  const fitsBelow=r.bottom+M+h<=bottom-M,fitsAbove=r.top-M-h>=top+M;
  const y=fitsBelow?r.bottom+M:fitsAbove?r.top-M-h:bottom-M-h;
  upop.style.top=Math.max(top+M,y)+'px';
}
/* libellé de l'unité « vide » (nombre sans unité) selon l'écriture choisie */
function ulab(b){
  if(b.classList.contains('u0'))b.textContent=(FX[b.id.replace(/-u$/,'')]||FXD)==='sci'?'×10ⁿ':'1,5';
}
function setFx(b,f){
  const vid=b.id.replace(/-u$/,''),i=vid.lastIndexOf('-'),tab=vid.slice(0,i),k=vid.slice(i+1);
  if((FX[vid]||FXD)===f)return;
  buzz();
  const r=readVal(tab,k);
  FX[vid]=f;sto.s(FXK,JSON.stringify(FX));applyFx();
  if('v' in r)writeVal(tab,k,r.v,12);
  const sg=upop.querySelector('.fseg');if(sg)segSet(sg,f==='sci'?1:0);
  recalc();save();
}
const SPRING='cubic-bezier(.34,1.45,.64,1)';
const wheelHTML=(opts,sel)=>`<div class="up-wh">${Object.keys(opts).map(k=>`<div class="up-it${k===sel?' on':''}" data-k="${k}">${k}</div>`).join('')}</div>`;

function upOpen(b){
  ucap=b;
  const act=document.activeElement;
  if(act&&act.matches&&act.matches('input,textarea'))act.blur();   // ferme le clavier : la fenêtre a toute la place
  const d=D[b.dataset.dim],named=Object.keys(d.u).filter(Boolean),comp=!!d.r,
        sci=(FX[b.id.replace(/-u$/,'')]||FXD)==='sci';
  /* écriture 1,5 / 1,5 × 10ⁿ */
  let h=`<div class="upf"><span>Écriture</span><div class="seg fseg" style="--n:2;--i:${sci?1:0}"><i class="th"></i><button type="button" data-fx="std"${sci?'':' class="on"'}>1,5</button><button type="button" data-fx="sci"${sci?' class="on"':''}>1,5 × 10ⁿ</button></div></div>`;
  /* unités nommées */
  if(named.length>1||comp&&named.length){
    h+=`<div class="up-n">${named.map(k=>`<button type="button" data-u="${k}"${k===b.value?' class="on"':''}>${k}</button>`).join('')}</div>`;
  }
  /* unité composée : deux molettes numérateur | dénominateur */
  if(comp){
    const[n,q]=upPair(b);
    h+=`<div class="up-h"><span>${t(d.lab[0])}</span><span>${t(d.lab[1])}</span></div><div class="up-c"><i class="up-lens"></i>${wheelHTML(d.r[0],n)}${wheelHTML(d.r[1],q)}</div>`;
  }
  if(!h)return;
  upop.innerHTML=h;upop.hidden=false;
  upop.querySelectorAll('.up-wh').forEach(wheel=>{
    toItem(wheel,wheel.querySelector('.on'),'instant');
    let last=centerIdx(wheel),timer=0;
    wheel.addEventListener('scroll',()=>{
      const i=centerIdx(wheel);
      if(i!==last){last=i;buzz(8);[...wheel.children].forEach((c,j)=>c.classList.toggle('on',j===i))}
      clearTimeout(timer);timer=setTimeout(wheelPick,110);
    },{passive:true});
  });
  upPlace();
  if(!RM)upAnimateIn(b);
}
/* apparition : ressort qui part de l'unité touchée */
function upAnimateIn(b){
  upop.getAnimations().forEach(a=>a.cancel());
  const r=b.getBoundingClientRect(),L=parseFloat(upop.style.left)||0,T=parseFloat(upop.style.top)||0,below=T>=r.top,
        ox=Math.max(0,Math.min(upop.offsetWidth,r.left+r.width/2-L));
  upop.style.transformOrigin=`${ox}px ${below?'0':'100%'}`;
  upop.animate([{opacity:0,transform:`scale(.82) translateY(${below?-10:10}px)`},{opacity:1,transform:'none'}],{duration:460,easing:SPRING});
  upop.querySelectorAll('.up-n button').forEach((x,k)=>x.animate(
    [{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'none'}],{duration:420,delay:70+k*22,easing:SPRING,fill:'backwards'}));
}
function upClose(){
  if(upop.hidden)return;
  ucap=null;
  if(RM){upop.hidden=true;return}
  const a=upop.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.9)'}],{duration:170,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
  a.onfinish=()=>{if(!ucap)upop.hidden=true;a.cancel()};
}

document.addEventListener('click',e=>{

});

/* ---------- 13. Résultat flottant et clavier (mobile) ----------
   La capsule #mini affiche le résultat quand la carte résultat n'est pas visible.
   Clavier ouvert : elle se pose juste au-dessus du clavier et le champ en cours de saisie reste visible au-dessus d'elle. */
const KB_MIN=120;                       // écart de hauteur (px) à partir duquel le clavier est considéré ouvert
const MINI_GAP=10;                      // espace capsule ↔ clavier
const FIELD_GAP=12;                     // espace champ ↔ capsule
const FIELD_SEL='input,textarea,[contenteditable]';
const mini=$('mini');
let resInView=true;                     // la carte résultat est-elle à l'écran ? (IntersectionObserver)
let kbOpen=false;
let baseH=innerHeight;                  // hauteur de la fenêtre sans clavier

const miniH=()=>mini.offsetHeight||46;
const kbTop=()=>VV.offsetTop+VV.height; // bord haut du clavier = bas de la zone réellement visible

/* la capsule s'affiche si le résultat n'est pas (entièrement) visible ; avec le clavier on teste la zone visible */
function miniUpd(){
  let seen=resInView;
  if(kbOpen&&VV){
    const r=$('rv').getBoundingClientRect(),limit=kbTop()-miniH()-16;
    seen=r.top>=VV.offsetTop-4&&r.bottom<=limit+4;
  }
  mini.classList.toggle('on',S.ok&&!seen);
}

/* le champ en cours de saisie reste entièrement au-dessus de la capsule (ou du clavier si la capsule est masquée) */
function keepFieldVisible(){
  if(!kbOpen)return;
  const f=document.activeElement;
  if(!f||!f.matches(FIELD_SEL))return;
  const box=f.closest('.fl')||f,
        limit=(mini.classList.contains('on')?kbTop()-miniH()-MINI_GAP:kbTop())-FIELD_GAP,
        overflow=box.getBoundingClientRect().bottom-limit;
  if(overflow>2)scrollBy(0,overflow);
}

function onKeyboard(){
  const f=document.activeElement,focused=!!f&&f.matches(FIELD_SEL);
  if(!focused)baseH=Math.max(innerHeight,VV.height+VV.offsetTop);
  kbOpen=focused&&(baseH-VV.height>KB_MIN||baseH-innerHeight>KB_MIN);   // 2e test : navigateurs qui redimensionnent la page
  root.classList.toggle('kb',kbOpen);
  mini.style.top=kbOpen?Math.max(0,Math.round(kbTop()-miniH()-MINI_GAP))+'px':'';
  mini.style.bottom=kbOpen?'auto':'';
  miniUpd();keepFieldVisible();
}

if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{resInView=es[0].isIntersecting;miniUpd()},{threshold:.3}).observe($('rv'));
}
if(VV){
  VV.addEventListener('resize',onKeyboard);
  VV.addEventListener('scroll',onKeyboard);
  addEventListener('scroll',()=>{if(kbOpen)onKeyboard()},{passive:true});
  addEventListener('input',()=>{if(kbOpen)requestAnimationFrame(onKeyboard)});
  addEventListener('focusin',()=>[100,350,700].forEach(ms=>setTimeout(onKeyboard,ms)));   // le clavier met un moment à monter
  addEventListener('focusout',()=>setTimeout(onKeyboard,120));
}

window.BioConvertTests=()=>{const R=[],near=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(b)),T_=(n,ok,got='')=>R.push({n,ok:!!ok,got});
  const tb=id=>TABS.find(x=>x.id===id),cs=tb('conc').solve,q=tb('qty').solve,mol={U:{a:'M',b:'g/L'}},same={U:{a:'mM',b:'µM'}};

  let v=cs.b({a:.5,M:58.44},mol);T_('NaCl 0,5 M → 29,22 g/L',near(v,29.22),String(v));
  v=cs.b({a:20*fu('conc','mg/mL'),M:180.16},{U:{a:'mg/mL',b:'mM'}})/fu('conc','mM');T_('Glucose 20 mg/mL → 111 mM',Math.abs(v-111.012)<.01,String(v));
  v=cs.b({a:1e-3},same)/fu('conc','µM');T_('1 mM = 1 000 µM',near(v,1000),String(v));
  T_('5 % (m/V) = 50 g/L ; 1 ppm = 1 mg/L',near(5*fu('conc','% (m/V)'),50)&&near(fu('conc','ppm'),fu('conc','mg/L')));
